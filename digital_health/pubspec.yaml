name: digital_health
description: "Elderly Digital Health Companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  google_fonts: ^6.2.1
  http: ^1.2.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  intl: ^0.19.0
  record: ^5.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  flutter_tts: ^4.2.2
  flutter_dotenv: ^5.2.1

dependency_overrides:
  record_platform_interface: 1.5.0
  record_linux: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
